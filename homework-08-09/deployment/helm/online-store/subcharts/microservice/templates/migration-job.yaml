{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "microservice.fullname" . }}-migration
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "microservice.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy }}
          args: ["migrate"]
          env:
            - name: {{ .Values.envPrefix }}_DB_HOST
              value: {{ include "microservice.databaseName" . | quote }}
            - name: {{ .Values.envPrefix }}_DB_PORT
              value: "5432"
            - name: {{ .Values.envPrefix }}_DB_USER
              value: {{ .Values.database.username | quote }}
            - name: {{ .Values.envPrefix }}_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "microservice.secretName" . }}
                  key: db-password
            - name: {{ .Values.envPrefix }}_DB_DBNAME
              value: {{ .Values.database.database | quote }}
            - name: {{ .Values.envPrefix }}_DB_SSLMODE
              value: disable
            - name: {{ .Values.envPrefix }}_DB_STARTUP_TIMEOUT
              value: {{ .Values.database.startupTimeout | quote }}
            - name: {{ .Values.envPrefix }}_DB_RETRY_INTERVAL
              value: {{ .Values.database.retryInterval | quote }}
{{- end }}
