      OTUS_BILLING_SERVICE_DB_USER: billing_service
      OTUS_BILLING_SERVICE_DB_PASSWORD: billing_service
      OTUS_BILLING_SERVICE_DB_DBNAME: billing_service
      OTUS_BILLING_SERVICE_DB_SSLMODE: disable
    depends_on:
      billing-postgres:
        condition: service_healthy
    networks:
      - backend

  billing-service:
    build:
      context: ../..
      dockerfile: services/billing-service/Dockerfile
    container_name: billing-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      OTUS_BILLING_SERVICE_APP_NAME: billing-service
      OTUS_BILLING_SERVICE_APP_ENV: development
      OTUS_BILLING_SERVICE_HTTP_ADDR: 0.0.0.0:8001
      OTUS_BILLING_SERVICE_DB_HOST: billing-postgres
      OTUS_BILLING_SERVICE_DB_PORT: 5432
      OTUS_BILLING_SERVICE_DB_USER: billing_service
      OTUS_BILLING_SERVICE_DB_PASSWORD: billing_service
      OTUS_BILLING_SERVICE_DB_DBNAME: billing_service
      OTUS_BILLING_SERVICE_DB_SSLMODE: disable
      OTUS_BILLING_SERVICE_KAFKA_BROKERS: kafka:29092
      OTUS_BILLING_SERVICE_KAFKA_TOPIC: billing.commands.v1
      OTUS_BILLING_SERVICE_KAFKA_GROUP_ID: billing-service-v1
      OTUS_BILLING_SERVICE_OUTBOX_POLL_INTERVAL: 500ms
    depends_on:
      billing-postgres:
        condition: service_healthy
      billing-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks:
      - monitoring
      - backend

  user-service:
