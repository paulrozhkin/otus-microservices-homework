apiVersion: 1
groups:
  - orgId: 1
    name: Users Service Evaluation Group
    folder: Users Service Alerting
    interval: 1m
    rules:
      - uid: users-service-high-error-rate
        title: Users Service High Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                100 *
                sum(rate(http_requests_total{namespace="users-service", service="users-service", status=~"5.."}[5m]))
                /
                sum(rate(http_requests_total{namespace="users-service", service="users-service"}[5m]))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 1m
        keepFiringFor: 2m
        annotations:
          summary: Users service 5xx error rate is above 5%
        labels:
          severity: warning
        isPaused: false
      - uid: users-service-high-latency
        title: Users Service High Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                histogram_quantile(
                  0.95,
                  sum by (le) (
                    rate(http_request_duration_seconds_bucket{namespace="users-service", service="users-service"}[5m])
                  )
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 1m
        keepFiringFor: 2m
        annotations:
          summary: Users service p95 latency is above 500ms
        labels:
          severity: warning
        isPaused: false
