apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.names.configMap }}
  labels:
    {{- include "users-service.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.env | quote }}
  APP_NAME: {{ .Values.app.name | quote }}
  HTTP_ADDR: {{ .Values.http.addr | quote }}
  HTTP_SHUTDOWN_TIMEOUT: {{ .Values.http.shutdownTimeout | quote }}
  DB_HOST: {{ .Values.db.host | quote }}
  DB_PORT: {{ .Values.db.port | quote }}
  DB_TIMEZONE: {{ .Values.db.timezone | quote }}
