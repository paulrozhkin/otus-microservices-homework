openapi: 3.0.3
info:
  title: Billing Service
  version: "1.0.0"
  description: |
    Billing service owns user accounts and their balances. Monetary values are
    represented as integer minor units. Public endpoints receive the authenticated
    user id from the API gateway. Internal endpoints are available only inside the cluster.
servers:
  - description: Local server
    url: http://localhost:8001
  - description: Kubernetes ingress
    url: http://arch.homework
tags:
  - name: account
    description: Operations with the current authenticated user's account
  - name: internal
    description: Service-to-service operations
  - name: health
    description: Kubernetes probes
paths:
  /api/v1/billing/account:
    get:
      tags: [account]
      summary: Get current billing account
      description: Returns the account selected by the trusted X-Auth-UserId header.
      operationId: getCurrentAccount
      security:
        - GatewayAuth: []
      responses:
        "200":
          description: Current billing account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /api/v1/billing/deposits:
    post:
      tags: [account]
      summary: Deposit money
      description: Credits a positive amount to the current user's account.
      operationId: depositMoney
      security:
        - GatewayAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceOperationRequest"
            example:
              amount: 10000
              operationId: 6e757e01-a09b-44e8-a348-bd2f8f55c95c
      responses:
        "200":
          description: Money was deposited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceOperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /api/v1/billing/withdrawals:
    post:
      tags: [account]
      summary: Withdraw money
      description: Debits a positive amount if the account has sufficient funds.
      operationId: withdrawMoney
      security:
        - GatewayAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceOperationRequest"
            example:
              amount: 2500
              operationId: 881073d0-85e2-492c-8b0d-792e381b49fb
      responses:
        "200":
          description: Money was withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceOperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InsufficientFunds"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /internal/v1/accounts/{userId}:
    put:
      tags: [internal]
      summary: Create user account
      description: Idempotently creates an empty billing account for a user.
      operationId: createAccount
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Account already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "201":
          description: Account was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /internal/v1/payments:
    post:
      tags: [internal]
      summary: Pay for an order
      description: Idempotently debits an account using operationId as the idempotency key.
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
            example:
              operationId: order-f98cd1e7-3072-4d3a-90ed-444cd25a7ed1
              userId: 42
              amount: 6000
      responses:
        "200":
          description: Payment succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/InsufficientFunds"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /internal/v1/payments/{operationId}/refund:
    post:
      tags: [internal]
      summary: Refund a payment
      description: Idempotently compensates a payment or withdrawal operation.
      operationId: refundPayment
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Payment was refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /livez:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: liveness
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: readiness
      responses:
        "200":
          description: Service and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    GatewayAuth:
      type: apiKey
      in: header
      name: X-Auth-UserId
      description: Trusted user id supplied by ingress after session validation.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 42
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
      example: order-f98cd1e7-3072-4d3a-90ed-444cd25a7ed1
  schemas:
    Account:
      type: object
      required: [userId, balance, createdAt, updatedAt]
      properties:
        userId:
          type: integer
          format: int64
          example: 42
        balance:
          type: integer
          format: int64
          minimum: 0
          description: Account balance in integer minor monetary units.
          example: 10000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BalanceOperationRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          example: 10000
        operationId:
          type: string
          maxLength: 128
          description: Optional idempotency key. The service generates a UUID when omitted.
    BalanceOperationResponse:
      type: object
      required: [operationId, account]
      properties:
        operationId:
          type: string
        account:
          $ref: "#/components/schemas/Account"
    PaymentRequest:
      type: object
      required: [operationId, userId, amount]
      properties:
        operationId:
          type: string
          maxLength: 128
        userId:
          type: integer
          format: int64
          minimum: 1
        amount:
          type: integer
          format: int64
          minimum: 1
    PaymentResponse:
      type: object
      required: [operationId, status, account]
      properties:
        operationId:
          type: string
        status:
          type: string
          enum: [succeeded]
        account:
          $ref: "#/components/schemas/Account"
    RefundResponse:
      type: object
      required: [operationId, status, account]
      properties:
        operationId:
          type: string
          description: Original payment operation id.
        status:
          type: string
          enum: [refunded]
        account:
          $ref: "#/components/schemas/Account"
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
          example: 400
        message:
          type: string
          example: invalid request
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication context is missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Account or operation was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InsufficientFunds:
      description: Account has insufficient funds
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 409
            message: insufficient funds
    ServiceUnavailable:
      description: Database is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnexpectedError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
