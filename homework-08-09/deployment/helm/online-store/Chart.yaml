apiVersion: v2
name: online-store
description: Order processing system with User, Billing, Warehouse, Order, Notification, PostgreSQL, and Kafka
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: microservice
    alias: user-service
    version: "0.1.0"
    repository: "file://subcharts/microservice"
    condition: user-service.enabled
  - name: microservice
    alias: billing-service
    version: "0.1.0"
    repository: "file://subcharts/microservice"
    condition: billing-service.enabled
  - name: microservice
    alias: order-service
    version: "0.1.0"
    repository: "file://subcharts/microservice"
    condition: order-service.enabled
  - name: microservice
    alias: warehouse-service
    version: "0.1.0"
    repository: "file://subcharts/microservice"
    condition: warehouse-service.enabled
  - name: microservice
    alias: notification-service
    version: "0.1.0"
    repository: "file://subcharts/microservice"
    condition: notification-service.enabled
  - name: kafka-stack
    alias: kafka
    version: "0.1.0"
    repository: "file://subcharts/kafka-stack"
    condition: kafka.enabled
  - name: ingress-nginx
    version: "4.15.1"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingressNginx.enabled
