global:
  imagePullPolicy: IfNotPresent

enabled: true
componentName: kafka
image:
  repository: apache/kafka
  tag: "3.9.1"
topic:
  name: notification.requested.v1
  partitions: 2
  replicationFactor: 1
persistence:
  enabled: true
  size: 500Mi
  storageClass: ""
resources: {}
ui:
  enabled: true
  image:
    repository: ghcr.io/kafbat/kafka-ui
    tag: latest
  port: 8080
  resources: {}
