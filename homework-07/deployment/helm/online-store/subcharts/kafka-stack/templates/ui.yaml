{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kafka-stack.uiName" . }}
  labels:
    {{- include "kafka-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kafka-stack.uiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kafka-stack.uiSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: kafka-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: {{ .Release.Name | quote }}
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: {{ printf "%s:29092" (include "kafka-stack.fullname" .) | quote }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka-stack.uiName" . }}
  labels:
    {{- include "kafka-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
  selector:
    {{- include "kafka-stack.uiSelectorLabels" . | nindent 4 }}
{{- end }}
