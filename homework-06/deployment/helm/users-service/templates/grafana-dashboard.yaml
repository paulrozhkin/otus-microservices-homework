{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.names.service }}-grafana-dashboard
  namespace: {{ .Values.grafanaDashboard.namespace }}
  labels:
    {{ .Values.grafanaDashboard.label }}: {{ .Values.grafanaDashboard.labelValue | quote }}
    {{- include "users-service.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  dashboard-users-service-k8s.json: |
{{ .Files.Get "dashboards/dashboard-users-service-k8s.json" | indent 4 }}
{{- end }}
