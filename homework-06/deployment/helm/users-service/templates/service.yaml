apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.names.service }}
  labels:
    {{- include "users-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.names.app }}
