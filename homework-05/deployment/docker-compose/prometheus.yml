global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'users-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['users-service:8000']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
