services:
  user-postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - monitoring
      - backend

  user-migrate:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    command: ["migrate"]
    environment:
      OTUS_USER_SERVICE_DB_HOST: user-postgres
      OTUS_USER_SERVICE_DB_PORT: 5432
      OTUS_USER_SERVICE_DB_USER: user_service
      OTUS_USER_SERVICE_DB_PASSWORD: user_service
      OTUS_USER_SERVICE_DB_DBNAME: user_service
      OTUS_USER_SERVICE_DB_SSLMODE: disable
    depends_on:
      user-postgres:
        condition: service_healthy
    networks:
      - backend

  billing-postgres:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: billing_service
      POSTGRES_USER: billing_service
      POSTGRES_PASSWORD: billing_service
    volumes:
      - billing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing_service -d billing_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  billing-migrate:
    build:
      context: ../..
      dockerfile: services/billing-service/Dockerfile
    command: ["migrate"]
    environment:
      OTUS_BILLING_SERVICE_DB_HOST: billing-postgres
      OTUS_BILLING_SERVICE_DB_PORT: 5432
      OTUS_BILLING_SERVICE_DB_USER: billing_service
      OTUS_BILLING_SERVICE_DB_PASSWORD: billing_service
      OTUS_BILLING_SERVICE_DB_DBNAME: billing_service
      OTUS_BILLING_SERVICE_DB_SSLMODE: disable
    depends_on:
      billing-postgres:
        condition: service_healthy
    networks:
      - backend

  billing-service:
    build:
      context: ../..
      dockerfile: services/billing-service/Dockerfile
    container_name: billing-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      OTUS_BILLING_SERVICE_APP_NAME: billing-service
      OTUS_BILLING_SERVICE_APP_ENV: development
      OTUS_BILLING_SERVICE_HTTP_ADDR: 0.0.0.0:8001
      OTUS_BILLING_SERVICE_DB_HOST: billing-postgres
      OTUS_BILLING_SERVICE_DB_PORT: 5432
      OTUS_BILLING_SERVICE_DB_USER: billing_service
      OTUS_BILLING_SERVICE_DB_PASSWORD: billing_service
      OTUS_BILLING_SERVICE_DB_DBNAME: billing_service
      OTUS_BILLING_SERVICE_DB_SSLMODE: disable
    depends_on:
      billing-postgres:
        condition: service_healthy
      billing-migrate:
        condition: service_completed_successfully
    networks:
      - monitoring
      - backend

  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    container_name: users-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OTUS_USER_SERVICE_APP_NAME: users-service
      OTUS_USER_SERVICE_APP_ENV: development
      OTUS_USER_SERVICE_HTTP_ADDR: 0.0.0.0:8000
      OTUS_USER_SERVICE_DB_HOST: user-postgres
      OTUS_USER_SERVICE_DB_PORT: 5432
      OTUS_USER_SERVICE_DB_USER: user_service
      OTUS_USER_SERVICE_DB_PASSWORD: user_service
      OTUS_USER_SERVICE_DB_DBNAME: user_service
      OTUS_USER_SERVICE_DB_SSLMODE: disable
      OTUS_USER_SERVICE_BILLING_BASE_URL: http://billing-service:8001
    depends_on:
      user-postgres:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
      billing-service:
        condition: service_started
    networks:
      - monitoring
      - backend

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  backend:
    driver: bridge

volumes:
  user-postgres-data:
  billing-postgres-data:
  prometheus_data:
  grafana-data:
