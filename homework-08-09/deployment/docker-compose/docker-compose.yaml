      OTUS_ORDER_SERVICE_DB_HOST: order-postgres
      OTUS_ORDER_SERVICE_DB_PORT: 5432
      OTUS_ORDER_SERVICE_DB_USER: order_service
      OTUS_ORDER_SERVICE_DB_PASSWORD: order_service
      OTUS_ORDER_SERVICE_DB_DBNAME: order_service
      OTUS_ORDER_SERVICE_DB_SSLMODE: disable
