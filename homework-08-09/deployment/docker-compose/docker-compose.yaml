services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - backend

  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for topic in \
          billing.commands.v1 \
          warehouse.commands.v1 \
          delivery.commands.v1 \
          order.saga.events.v1 \
          notification.commands.v1
        do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$$topic" \
            --partitions 2 \
            --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend

  user-postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d user_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - monitoring
      - backend

  user-migrate:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    command: ["migrate"]
    environment:
      OTUS_USER_SERVICE_DB_HOST: user-postgres
      OTUS_USER_SERVICE_DB_PORT: 5432
      OTUS_USER_SERVICE_DB_USER: user_service
      OTUS_USER_SERVICE_DB_PASSWORD: user_service
      OTUS_USER_SERVICE_DB_DBNAME: user_service
      OTUS_USER_SERVICE_DB_SSLMODE: disable
    depends_on:
      user-postgres:
        condition: service_healthy
    networks:
      - backend

  billing-postgres:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: billing_service
      POSTGRES_USER: billing_service
