apiVersion: v2
name: users-service
description: Users service with PostgreSQL, migrations, ingress, and optional infrastructure dependencies
type: application
version: 0.0.1
appVersion: "0.0.1"
dependencies:
  - name: ingress-nginx
    version: ">=4.0.0"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingressNginx.enabled
  - name: postgresql
    version: ">=16.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
