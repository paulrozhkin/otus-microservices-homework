    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    command: ["migrate"]
    environment:
      OTUS_NOTIFICATION_SERVICE_DB_HOST: notification-postgres
      OTUS_NOTIFICATION_SERVICE_DB_PORT: 5432
      OTUS_NOTIFICATION_SERVICE_DB_USER: notification_service
      OTUS_NOTIFICATION_SERVICE_DB_PASSWORD: notification_service
      OTUS_NOTIFICATION_SERVICE_DB_DBNAME: notification_service
      OTUS_NOTIFICATION_SERVICE_DB_SSLMODE: disable
    depends_on:
      notification-postgres:
        condition: service_healthy
    networks:
      - backend

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      OTUS_NOTIFICATION_SERVICE_APP_NAME: notification-service
      OTUS_NOTIFICATION_SERVICE_APP_ENV: development
      OTUS_NOTIFICATION_SERVICE_HTTP_ADDR: 0.0.0.0:8003
      OTUS_NOTIFICATION_SERVICE_DB_HOST: notification-postgres
      OTUS_NOTIFICATION_SERVICE_DB_PORT: 5432
      OTUS_NOTIFICATION_SERVICE_DB_USER: notification_service
      OTUS_NOTIFICATION_SERVICE_DB_PASSWORD: notification_service
      OTUS_NOTIFICATION_SERVICE_DB_DBNAME: notification_service
      OTUS_NOTIFICATION_SERVICE_DB_SSLMODE: disable
      OTUS_NOTIFICATION_SERVICE_KAFKA_BROKERS: kafka:29092
      OTUS_NOTIFICATION_SERVICE_KAFKA_TOPIC: notification.commands.v1
      OTUS_NOTIFICATION_SERVICE_KAFKA_GROUP_ID: notification-service-v1
    depends_on:
      notification-postgres:
        condition: service_healthy
      notification-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    networks:
      - monitoring
      - backend

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - 9100
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
  backend:
    driver: bridge

volumes:
  user-postgres-data:
  billing-postgres-data:
  order-postgres-data:
  notification-postgres-data:
  warehouse-postgres-data:
  delivery-postgres-data:
  prometheus_data:
  grafana-data:
